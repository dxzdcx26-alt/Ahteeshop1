<style>
    .font-bold {
        font-weight: 700;
    }

    .font-semibold {
        font-weight: 600;
    }

    .img-anim {
        position: relative;
        text-align: center;
        overflow: hidden;
        border-radius: 1vh;
    }

    .img-anim img {
        width: 100%;
        height: auto;
        margin-left: auto;
    }

    .img-anim>img {
        background-size: cover;
        background-position: center;
        transition: all 0.3s ease;
    }

    .img-anim>div.bg {
        position: absolute;
        z-index: 2;
        opacity: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(1, 1, 1, 0.3);
        transition: all 0.3s ease;
    }

    .img-anim>div.text {
        position: absolute;
        z-index: 3;
        top: 120%;
        left: 50%;
        opacity: 0;
        color: #fff;
        font-size: 20px;
        border-bottom: 3px solid transparent;
        border-image: linear-gradient(to right, var(--main), var(--main));
        border-image-slice: 1;
        transform: translate(-50%, -50%);
        transition: all 0.3s ease;
    }

    .img-anim:hover>img {
        transform: scale(1.1);
    }

    .img-anim:hover>div {
        opacity: 1;
    }

    .img-anim:hover>div.text {
        top: 80%;
        opacity: 1;
    }

    .content {
        height: auto;
        border: 3px solid rgba(0, 0, 0, .3);
        transition: all .5s ease;
    }

    .content:hover {
        border: 3.5px solid var(--main);
    }

    .btn-main {
        color: var(--main);
        background: var(--main-30);
        border: 1px solid var(--main);
        transition: all .5s ease;
    }

    .btn-main.active {
        color: white;
        background-color: var(--main);
        border: 1px solid var(--main);
    }

    .btn-main.active i {
        color: white !important;
    }

    .btn-main:hover {
        color: white;
        background-color: var(--main);
        border: 1px solid var(--main);
    }

    }

    .btn-main-stock0.active i {
        color: white !important;
    }

    .btn-main-stock0:hover {
        color: white;
        background-color: red;
        border: 1px solid red;
    }

    @media only screen and (max-width: 500px) {
